service: taller-gateway
frameworkVersion: "3"

package:
  individually: true

plugins:
  - serverless-localstack
  - serverless-esbuild
  - ../../scripts/serverless-cors.cjs

custom:
  localstack:
    stages:
      - local
    host: http://127.0.0.1
    edgePort: 4566
    autostart: false
  esbuild:
    concurrency: 1
    zipConcurrency: 1
    bundle: true
    platform: node
    target: node22
    sourcemap: true

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'local'}
  region: us-east-1
  environment:
    STAGE: ${self:provider.stage}
    JWT_SECRET: ${env:JWT_SECRET, ssm:/taller/${self:provider.stage}/jwt-secret}
    CORS_ORIGINS: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
  apiGateway:
    usagePlan:
      - freeTier:
          quota:
            limit: 10000
            period: MONTH
          throttle:
            rateLimit: 10
            burstLimit: 20
    apiKeys:
      - freeTier:
          - ${self:provider.stage}-AmazonLite-DefaultKey
  iamRoleStatements:
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "*"

functions:
  ping:
    handler: src/handlers/ping.ping
    name: taller-${self:provider.stage}-Gateway-Ping
    events:
      - http:
          method: get
          path: /gateway/ping
          cors:
            origin: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
  authorizer:
    handler: src/handlers/authorizer.authorizer
    name: taller-${self:provider.stage}-Authorizer

resources:
  Resources:
    MainAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: taller-${self:provider.stage}-jwt-authorizer
        RestApiId: { Ref: ApiGatewayRestApi }
        Type: TOKEN
        IdentitySource: method.request.header.Authorization
        AuthorizerUri:
          Fn::Sub: >-
            arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambdaFunction.Arn}/invocations
        AuthorizerResultTtlInSeconds: 0

    AuthorizerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: { "Fn::GetAtt": [AuthorizerLambdaFunction, Arn] }
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn:
          Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/authorizers/*

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseType: UNAUTHORIZED
        StatusCode: "401"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseType: ACCESS_DENIED
        StatusCode: "403"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token'"

    GatewayResponseDefault4xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token'"

    GatewayResponseDefault5xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token'"

  Outputs:
    ScopedMainRestApiId:
      Value: { Ref: ApiGatewayRestApi }
      Export: { Name: "MainRestApiId-${self:provider.stage}" }
    ScopedMainRestApiRootResourceId:
      Value:
        Fn::GetAtt: [ApiGatewayRestApi, RootResourceId]
      Export: { Name: "MainRestApiRootResourceId-${self:provider.stage}" }
    ScopedMainAuthorizerId:
      Value: { Ref: MainAuthorizer }
      Export: { Name: "MainAuthorizerId-${self:provider.stage}" }
