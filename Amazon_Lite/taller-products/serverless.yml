service: taller-products
frameworkVersion: "3"

package:
  individually: true

plugins:
  - serverless-localstack
  - serverless-esbuild
  - ../../scripts/serverless-cors.cjs

custom:
  localstack:
    stages: [local]
    host: http://127.0.0.1
    edgePort: 4566
    autostart: false
  esbuild:
    concurrency: 1
    zipConcurrency: 1
    bundle: true
    platform: node
    target: node22
    sourcemap: true
    exclude: []

provider:
  name: aws
  runtime: nodejs22.x
  timeout: 30
  stage: ${opt:stage, 'local'}
  region: us-east-1
  environment:
    STAGE: ${self:provider.stage}
    JWT_SECRET: ${env:JWT_SECRET, ssm:/taller/${self:provider.stage}/jwt-secret}
    CORS_ORIGINS: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
    PRODUCTS_TABLE: { Ref: ProductsTable }
  apiGateway:
    restApiId:
      Fn::ImportValue: "MainRestApiId-${self:provider.stage}"
    restApiRootResourceId:
      Fn::ImportValue: "MainRestApiRootResourceId-${self:provider.stage}"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [ProductsTable, Arn]
            - Fn::Sub: ${ProductsTable.Arn}/index/*

functions:
  createProduct:
    handler: src/handlers/createProduct.createProduct
    name: taller-${self:provider.stage}-Products-CreateProduct
    events:
      - http:
          method: post
          path: products/create
          cors:
            origin: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
            headers: [Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token]
          authorizer:
            type: CUSTOM
            authorizerId:
              Fn::ImportValue: "MainAuthorizerId-${self:provider.stage}"
  getProduct:
    handler: src/handlers/getProduct.getProduct
    name: taller-${self:provider.stage}-Products-GetProduct
    events:
      - http:
          method: get
          path: products/{id}
          cors:
            origin: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
            headers: [Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token]
  updateProduct:
    handler: src/handlers/updateProduct.updateProduct
    name: taller-${self:provider.stage}-Products-UpdateProduct
    events:
      - http:
          method: put
          path: products/{id}
          cors:
            origin: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
            headers: [Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token]
          authorizer:
            type: CUSTOM
            authorizerId:
              Fn::ImportValue: "MainAuthorizerId-${self:provider.stage}"
  deleteProduct:
    handler: src/handlers/deleteProduct.deleteProduct
    name: taller-${self:provider.stage}-Products-DeleteProduct
    events:
      - http:
          method: delete
          path: products/{id}
          cors:
            origin: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
            headers: [Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token]
          authorizer:
            type: CUSTOM
            authorizerId:
              Fn::ImportValue: "MainAuthorizerId-${self:provider.stage}"
  listAllProducts:
    handler: src/handlers/listAllProducts.listAllProducts
    name: taller-${self:provider.stage}-Products-ListAllProducts
    events:
      - http:
          method: get
          path: products
          cors:
            origin: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
            headers: [Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token]
  listProductsBySeller:
    handler: src/handlers/listProductsBySeller.listProductsBySeller
    name: taller-${self:provider.stage}-Products-ListProductsBySeller
    events:
      - http:
          method: get
          path: products/users/{sellerId}
          cors:
            origin: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
            headers: [Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token]
  updateStock:
    handler: src/handlers/updateStock.updateStock
    name: taller-${self:provider.stage}-Products-UpdateStock
    events:
      - http:
          method: patch
          path: products/{id}/stock
          cors:
            origin: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
            headers: [Content-Type, Authorization, X-Api-Key, X-Amz-Date, X-Amz-Security-Token]
          authorizer:
            type: CUSTOM
            authorizerId:
              Fn::ImportValue: "MainAuthorizerId-${self:provider.stage}"

resources:
  Resources:
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-products
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
          - AttributeName: sellerId
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: seller-index
            KeySchema:
              - AttributeName: sellerId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
